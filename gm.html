<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Watch GM</title>
<style>
  :root { --bg: #101316; --fg: #e6dcc0; --dim: #8a8f86; --brass: #b08d57; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px 'IBM Plex Mono', ui-monospace, monospace; }
  header { padding: 10px 16px; border-bottom: 1px solid #333; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; letter-spacing: 2px; color: var(--brass); }
  #status { color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; }
  canvas { width: 100%; height: auto; background: #0d1b22; border: 1px solid #333; }
  aside { display: flex; flex-direction: column; gap: 10px; }
  button { background: #1d2228; color: var(--fg); border: 1px solid var(--brass); padding: 8px; font: inherit; cursor: pointer; border-radius: 3px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  textarea { width: 100%; height: 60px; background: #0a0c0e; color: var(--fg); border: 1px solid #444; font: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { padding: 3px 4px; border-bottom: 1px solid #222; text-align: left; }
  .el { color: #5cff9d; font-weight: 600; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="gate">
  <div>GM ONLY · open this on your own screen, not the stream</div>
  <input id="pw" placeholder="passphrase" style="padding:8px;font:inherit">
  <button id="enter">ENTER</button>
  <div style="color:var(--dim);font-size:12px">Default passphrase: geryon (change it in gm.html)</div>
</div>
<header><h1>THE LAST WATCH · GM TRUTH VIEW</h1><span id="status">waiting for the game tab...</span></header>
<main>
  <canvas id="map" width="1000" height="650"></canvas>
  <aside>
    <div class="grid">
      <button data-cmd="pause">Pause / resume</button>
      <button data-cmd="repair">Repair everything</button>
      <button data-cmd="restock">Refill beacons</button>
      <button data-cmd="shark-home">Send shark away</button>
      <button data-cmd="calibrate">Calibrate scanner</button>
      <button data-cmd="win">Force win</button>
      <button data-cmd="reset">Reset game</button>
    </div>
    <div>Send a note down the pneumatic tube:</div>
    <div class="grid">
      <button data-note="The old sentries swore the Bull sings loudest in the north-east.">Hint 1: north-east</button>
      <button data-note="The big ones ride the deep water, officer. Read the deep current near your target.">Hint 2: deep current</button>
      <button data-note="Coldsteel's halls ring hollow, its bones are iron, and it sings with three voices.">Hint 3: three signs</button>
      <button data-note="Two pings in one place and the Grindmaw comes. Move the buoy.">Hint: shark</button>
    </div>
    <textarea id="custom" placeholder="Write your own note..."></textarea>
    <button id="sendnote">Send note</button>
    <table id="roster"></table>
  </aside>
</main>
<script type="module">
const PASS = 'geryon';
const gate = document.getElementById('gate');
document.getElementById('enter').onclick = () => { if (document.getElementById('pw').value.trim().toLowerCase() === PASS) gate.remove(); };
document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') document.getElementById('enter').click(); };

const ch = new BroadcastChannel('lastwatch-gm');
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => { if (b.dataset.cmd !== 'reset' || confirm('Reset the game for everyone?')) ch.postMessage({ cmd: b.dataset.cmd }); });
document.querySelectorAll('[data-note]').forEach(b => b.onclick = () => ch.postMessage({ note: b.dataset.note }));
document.getElementById('sendnote').onclick = () => { const v = document.getElementById('custom').value.trim(); if (v) ch.postMessage({ note: v }); };

const cv = document.getElementById('map'), ctx = cv.getContext('2d');
const z = 1000 / 4000;
const P = (x, y) => [x * z, y * z];
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const COLORS = { red: '#ff4b3a', amber: '#ffb347', green: '#5cff9d', blue: '#6fa8ff' };
ch.onmessage = ev => {
  const s = ev.data && ev.data.snap; if (!s) return;
  document.getElementById('status').textContent = `watch ${fmt(s.t)}${s.paused ? ' · PAUSED' : ''}${s.won ? ' · ELGARZ MARKED' : ''} · beacons ${s.beacons} · scanner ${s.calibrated ? 'calibrated' : 'not calibrated'}`;
  ctx.fillStyle = '#0d1b22'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(154,208,255,.4)'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(...P(s.tomb.x, s.tomb.y), 1000 * z, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#cfefff'; ctx.beginPath(); ctx.arc(...P(s.tomb.x, s.tomb.y), 5, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,179,71,.2)'; ctx.beginPath(); ctx.arc(...P(2000, 2480), 1500 * z, 0, 7); ctx.stroke();
  for (const c of s.cams) { ctx.fillStyle = c.broken ? '#ff4b3a' : '#e8cf98'; ctx.fillRect(c.x * z - 4, c.y * z - 4, 8, 8); ctx.font = '10px monospace'; ctx.fillText(`${c.name} ${Math.round(c.heat)}°`, c.x * z + 6, c.y * z + 4); }
  for (const r of s.remorhazes) { ctx.fillStyle = '#ff7a2a'; ctx.beginPath(); ctx.arc(r.x * z, r.y * z, 4, 0, 7); ctx.fill(); }
  if (s.buoy) { ctx.strokeStyle = 'rgba(92,255,157,.35)'; ctx.beginPath(); ctx.arc(s.buoy.x * z, s.buoy.y * z, 420 * z, 0, 7); ctx.stroke(); }
  ctx.fillStyle = '#ff4b3a'; ctx.beginPath(); ctx.arc(s.shark.x * z, s.shark.y * z, 5, 0, 7); ctx.fill(); ctx.fillText('shark ' + s.shark.mode, s.shark.x * z + 7, s.shark.y * z);
  for (const b of s.bergs) {
    const notable = b.name !== 'Unremarkable ice';
    ctx.fillStyle = b.elgarz ? '#5cff9d' : notable ? '#ffd27a' : 'rgba(220,235,240,.5)';
    ctx.beginPath(); ctx.arc(b.x * z, b.y * z, b.elgarz ? 7 : b.large ? 4 : 2.5, 0, 7); ctx.fill();
    if (b.tag) { ctx.strokeStyle = COLORS[b.tag]; ctx.lineWidth = 2; ctx.strokeRect(b.x * z - 7, b.y * z - 7, 14, 14); ctx.lineWidth = 1; }
    if (notable) { ctx.font = (b.elgarz ? '600 ' : '') + '11px monospace'; ctx.fillText(`#${b.num} ${b.name}`, b.x * z + 8, b.y * z + 4); }
  }
  if (s.ghost) { ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(s.ghost.x * z, s.ghost.y * z, 8, 0, 7); ctx.stroke(); }
  const notable = s.bergs.filter(b => b.name !== 'Unremarkable ice').sort((a, b) => b.elgarz - a.elgarz);
  document.getElementById('roster').innerHTML = '<tr><th>#</th><th>Name</th><th>Hollow</th><th>Metal</th><th>Radio</th><th>Tag</th></tr>' +
    notable.map(b => `<tr class="${b.elgarz ? 'el' : ''}"><td>${b.num}</td><td>${b.name}</td><td>${b.hollow ? 'yes' : '-'}</td><td>${b.metal ? 'yes' : '-'}</td><td>${b.radio ? b.radio.freq + ' ' + b.radio.song : '-'}</td><td>${b.tag || ''}</td></tr>`).join('');
};
</script>
</body>
</html>
