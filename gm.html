<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Watch GM</title>
<style>
  :root { --bg: #101316; --fg: #e6dcc0; --dim: #8a8f86; --brass: #b08d57; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px 'IBM Plex Mono', ui-monospace, monospace; }
  header { padding: 10px 16px; border-bottom: 1px solid #333; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; letter-spacing: 2px; color: var(--brass); }
  #status { color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; padding: 12px; }
  canvas { width: 100%; height: auto; background: #0d1b22; border: 1px solid #333; }
  aside { display: flex; flex-direction: column; gap: 10px; }
  button { background: #1d2228; color: var(--fg); border: 1px solid var(--brass); padding: 8px; font: inherit; cursor: pointer; border-radius: 3px; }
  input { background: #0a0c0e; color: var(--fg); border: 1px solid #444; font: inherit; padding: 7px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  textarea { width: 100%; height: 60px; background: #0a0c0e; color: var(--fg); border: 1px solid #444; font: inherit; box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { padding: 3px 4px; border-bottom: 1px solid #222; text-align: left; }
  .el { color: #5cff9d; font-weight: 600; }
  .box { border: 1px solid #333; padding: 8px; font-size: 12px; line-height: 1.5; }
  .box b { color: var(--brass); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .tools button.on { background: var(--brass); color: #000; }
  .lev { display: grid; grid-template-columns: 120px 1fr 44px; gap: 6px; align-items: center; font-size: 12px; }
  .lev input { width: 100%; }
  .row2 { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; z-index: 9; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="gate">
  <div>GM ONLY · open this on your own screen, not the stream</div>
  <input id="pw" placeholder="passphrase">
  <button id="enter">ENTER</button>
  <div style="color:var(--dim);font-size:12px">Default passphrase: geryon (change it in gm.html)</div>
</div>
<header><h1>THE LAST WATCH · GM TRUTH VIEW</h1><span id="status">waiting for the game tab...</span></header>
<main>
  <div>
    <div class="tools"><b style="align-self:center;color:var(--brass)">CLICK THE MAP TO:</b>
      <button data-tool="">look only</button><button data-tool="place-elgarz">place / move Elgarz</button><button data-tool="storm">drop a storm</button><button data-tool="shark-to">send the shark</button>
    </div>
    <canvas id="map" width="900" height="900"></canvas>
  </div>
  <aside>
    <div class="box" id="elgarz">Elgarz: waiting...</div>
    <div class="grid">
      <button data-cmd="pause">Pause / resume</button>
      <button data-cmd="stoke">Refuel furnace</button>
      <button data-cmd="repair">Repair everything</button>
      <button data-cmd="restock">Refill all beacons</button>
      <button data-cmd="shark-home">Send shark away</button>
      <button data-cmd="calibrate">Calibrate scanner</button>
      <button data-cmd="spawn">Bring Elgarz in now</button>
      <button data-cmd="win">Force win</button>
      <button data-cmd="clear-storms">Clear storms</button>
      <button data-cmd="flip">Flip the rune board</button>
      <button data-cmd="coffee">Fresh coffee</button>
      <button data-cmd="camunlock">Unlock the camera on screen</button>
    </div>
    <div class="box"><b>LEVERS</b> (1 = as designed)<div id="levers"></div></div>
    <div class="grid">
      <input id="seed" placeholder="seed (blank = new)">
      <button id="reset">Reset game</button>
    </div>
    <div class="box" id="tools"></div>
    <div>Send a note down the pneumatic tube:</div>
    <div class="grid">
      <button data-note="The old sentries swore Coldsteel's bones are iron and its halls ring hollow.">Hint: hollow and iron</button>
      <button data-note="The big ones ride the deep water, officer. Read the deep current near your target.">Hint: deep current</button>
      <button data-note="Every ping calls the Grindmaw to the spot. Ping, then move the buoy.">Hint: shark</button>
      <button data-note="Kill the cabin music before you trust anything you hear on the wireless.">Hint: music lies</button>
      <button data-note="Elgarz will not go near the Tomb of Levistus. Watch what turns away from it.">Hint: the Tomb</button>
      <button data-note="Feed the fire, officer, but not too much. Two shovels, never three.">Hint: furnace</button>
    </div>
    <textarea id="custom" placeholder="Write your own note..."></textarea>
    <div class="row2"><label><input type="radio" name="dest" value="note" checked> pneumatic tube note (rotates round the chart corners)</label></div>
    <div class="row2"><label><input type="radio" name="dest" value="ticker"> wire service ticker (overhead deck)</label></div>
    <button id="sendnote">Send</button>
    <table id="roster"></table>
  </aside>
</main>
<script type="module">
import { RUNES } from './src/glyphs.js';
import { MAP, CENTER, REACH, GRID, CELL, TOMB_RADIUS, TUNING as T } from './src/scenario.js';
const PASS = 'geryon';
const gate = document.getElementById('gate');
document.getElementById('enter').onclick = () => { if (document.getElementById('pw').value.trim().toLowerCase() === PASS) gate.remove(); };
document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') document.getElementById('enter').click(); };

const ch = new BroadcastChannel('lastwatch-gm:' + location.pathname.replace(/[^/]*$/, ''));
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => ch.postMessage({ cmd: b.dataset.cmd }));
let tool = '';
const toolBtns = document.querySelectorAll('[data-tool]');
toolBtns.forEach(b => b.onclick = () => { tool = b.dataset.tool; toolBtns.forEach(x => x.classList.toggle('on', x === b)); });
toolBtns[0].classList.add('on');
document.getElementById('map').addEventListener('click', e => {
  if (!tool) return;
  const r = e.target.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * MAP, y = (e.clientY - r.top) / r.height * MAP;
  ch.postMessage({ cmd: tool, arg: { x, y } });
});
const LEVERS = [['drift', 'World drift speed', 0, 3], ['tomb', 'Tomb speed', 0, 3], ['elgarz', 'Elgarz speed', 0, 3], ['shark', 'Grindmaw speed', 0, 3],
  ['burn', 'Furnace burn rate', 0, 3], ['remorhaz', 'Remorhaz aggression', 0, 3], ['aim', 'Beacon forgiveness', 0.5, 4], ['fatigue', 'Operator fatigue rate', 0, 3]];
document.getElementById('levers').innerHTML = LEVERS.map(([k, label, lo, hi]) => `<div class="lev"><span>${label}</span><input type="range" min="${lo}" max="${hi}" step="0.1" value="1" data-lever="${k}"><span id="lv-${k}">1.0</span></div>`).join('');
document.querySelectorAll('[data-lever]').forEach(inp => inp.oninput = () => {
  document.getElementById('lv-' + inp.dataset.lever).textContent = Number(inp.value).toFixed(1);
  ch.postMessage({ cmd: 'lever', arg: { name: inp.dataset.lever, value: Number(inp.value) } });
});
document.getElementById('reset').onclick = () => {
  const seed = Number(document.getElementById('seed').value) || null;
  if (confirm(seed ? `Reset the game with seed ${seed}?` : 'Reset the game with a new random seed?')) ch.postMessage({ cmd: 'reset', seed });
};
document.querySelectorAll('[data-note]').forEach(b => b.onclick = () => { const dest = document.querySelector('[name=dest]:checked').value; ch.postMessage(dest === 'ticker' ? { ticker: b.dataset.note } : { note: b.dataset.note }); });
document.getElementById('sendnote').onclick = () => {
  const v = document.getElementById('custom').value.trim(); if (!v) return;
  const dest = document.querySelector('[name=dest]:checked').value;
  ch.postMessage(dest === 'ticker' ? { ticker: v } : { note: v });
};

const cv = document.getElementById('map'), ctx = cv.getContext('2d');
const z = cv.width / MAP;
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const COLORS = { red: '#ff4b3a', amber: '#ffb347', green: '#5cff9d', blue: '#6fa8ff' };
const COLS = 'ABCDEFGHIJKL';
const ref = (x, y) => COLS[Math.max(0, Math.min(11, Math.floor(x / CELL)))] + (Math.max(0, Math.min(11, Math.floor(y / CELL))) + 1);
const lampName = s => s ? [...s].map(c => ({ R: 'red', W: 'white', B: 'blue' })[c]).join('-') : '';
ch.onmessage = ev => {
  const s = ev.data && ev.data.snap; if (!s) return;
  document.getElementById('status').textContent = `seed ${s.seed} · watch ${fmt(s.t)}${s.paused ? ' · PAUSED' : ''}${s.won ? ' · ELGARZ MARKED' : ''} · furnace ${s.furnace.lit ? Math.round(s.furnace.heat) + '°' : 'OUT'}, chute ${s.furnace.chute} · fatigue ${Math.round(s.fatigue * 100)}% · beacons ${s.beacons} + green ${s.green} · scanner ${s.calibrated ? 'calibrated' : 'not calibrated'} · music ${s.music ? 'ON' : 'off'}`;
  document.getElementById('seed').placeholder = `seed (now ${s.seed})`;
  ctx.fillStyle = '#0d1b22'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(160,200,200,.08)';
  for (let i = 0; i <= GRID; i++) { ctx.beginPath(); ctx.moveTo(i * CELL * z, 0); ctx.lineTo(i * CELL * z, cv.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * CELL * z); ctx.lineTo(cv.width, i * CELL * z); ctx.stroke(); }
  ctx.fillStyle = 'rgba(232,207,152,.6)'; ctx.font = '11px monospace';
  for (let i = 0; i < GRID; i++) { ctx.fillText(COLS[i], (i + 0.45) * CELL * z, 12); ctx.fillText(String(i + 1), 3, (i + 0.55) * CELL * z); }
  ctx.strokeStyle = 'rgba(232,207,152,.25)'; ctx.setLineDash([2, 5]); ctx.beginPath(); ctx.arc(CENTER.x * z, CENTER.y * z, REACH * z, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  for (const st of s.storms) { ctx.fillStyle = `rgba(220,230,240,${0.15 * st.strength})`; ctx.beginPath(); ctx.arc(st.x * z, st.y * z, st.r * z, 0, 7); ctx.fill(); }
  ctx.strokeStyle = 'rgba(154,208,255,.6)'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(s.tomb.x * z, s.tomb.y * z, TOMB_RADIUS * z, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#cfefff'; ctx.beginPath(); ctx.arc(s.tomb.x * z, s.tomb.y * z, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(CENTER.x * z, CENTER.y * z, 5, 0, 7); ctx.fill();
  for (const c of s.cams) {
    const f = c.facing * Math.PI / 180, hf = T.camFov / 2;
    ctx.fillStyle = c.broken ? 'rgba(255,75,58,.1)' : 'rgba(255,179,71,.07)'; ctx.beginPath(); ctx.moveTo(c.x * z, c.y * z);
    for (let a = -hf; a <= hf + 0.01; a += hf / 6) ctx.lineTo(c.x * z + Math.sin(f + a) * T.camRange * z, c.y * z - Math.cos(f + a) * T.camRange * z);
    ctx.fill();
    ctx.fillStyle = c.broken ? '#ff4b3a' : '#e8cf98'; ctx.fillRect(c.x * z - 4, c.y * z - 4, 8, 8); ctx.font = '10px monospace'; ctx.fillText(`${c.name} ${Math.round(c.heat)}°`, c.x * z + 6, c.y * z + 4);
  }
  for (const r of s.remorhazes) { ctx.fillStyle = '#ff7a2a'; ctx.beginPath(); ctx.arc(r.x * z, r.y * z, 4, 0, 7); ctx.fill(); }
  if (s.buoy) { ctx.strokeStyle = 'rgba(92,255,157,.35)'; ctx.beginPath(); ctx.arc(s.buoy.x * z, s.buoy.y * z, T.buoyRadius * z, 0, 7); ctx.stroke(); }
  if (s.lastPing && s.shark.mode === 'hunt') { ctx.strokeStyle = 'rgba(255,75,58,.5)'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(s.shark.x * z, s.shark.y * z); ctx.lineTo(s.lastPing.x * z, s.lastPing.y * z); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle = '#ff4b3a'; ctx.beginPath(); ctx.arc(s.shark.x * z, s.shark.y * z, 5, 0, 7); ctx.fill(); ctx.fillText('shark ' + s.shark.mode, s.shark.x * z + 7, s.shark.y * z);
  for (const b of s.bergs) {
    ctx.fillStyle = b.elgarz ? '#5cff9d' : b.notable ? '#ffd27a' : 'rgba(220,235,240,.45)';
    ctx.beginPath(); ctx.arc(b.x * z, b.y * z, b.elgarz ? 7 : b.large ? 3.5 : 2.2, 0, 7); ctx.fill();
    if (b.tag) { ctx.strokeStyle = COLORS[b.tag]; ctx.lineWidth = 2; ctx.strokeRect(b.x * z - 7, b.y * z - 7, 14, 14); ctx.lineWidth = 1; }
    if (b.notable) { ctx.font = (b.elgarz ? '600 ' : '') + '11px monospace'; ctx.fillText(`#${b.num} ${b.name}`, b.x * z + 8, b.y * z + 4); }
  }
  if (s.ghost) { ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(s.ghost.x * z, s.ghost.y * z, 8, 0, 7); ctx.stroke(); }

  const e = s.bergs.find(b => b.elgarz);
  const p = s.elgarzPlan;
  document.getElementById('elgarz').innerHTML = e
    ? `<b>Elgarz #${e.num}</b> is in <b>${ref(e.x, e.y)}</b>. Radio <b>${e.radio.freq}</b> (${e.radio.band}), ${e.radio.carrier}, lamps show ${lampName(e.radio.shown)}.` +
      (p ? `<br>Entered at the rim in ${ref(p.x, p.y)}; planned camera sightings: ${p.sightings}, first at ${fmt(p.firstSighting)}.` : '')
    : `<b>Elgarz</b> is not in the sea yet. It slips in at ${fmt(s.elgarzAt || 0)}.`;
  document.getElementById('tools').innerHTML =
    `<b>Scanner code now</b> (from the latest buoy reading): ${s.code ? s.code.map(i => RUNES[i].name).join(' → ') : 'no reading yet'}<br>` +
    `<b>Cabin wireless</b> (music on only): ${s.stations.map(st => `${st.freq} ${st.band}`).join(', ')}<br>` +
    `<b>Rune board</b> page ${s.board.page}: ${s.board.fns.join(' · ')}<br>` +
    `<b>Camera unlock code</b> (for the camera on screen): levers WIND ${s.camCode.wind}, TEMP ${s.camCode.temp}; plates ${s.camCode.order.join(' → ')}${Object.keys(s.camUnlocked).length ? ' · unlocked: ' + Object.entries(s.camUnlocked).map(([k, v]) => k + ' ' + v + 's').join(', ') : ''}<br>` +
    `<b>Broken</b>: ${s.broken.length ? s.broken.join(', ') : 'nothing'}`;
  for (const [k, v] of Object.entries(s.levers)) { const inp = document.querySelector(`[data-lever=${k}]`); if (inp && document.activeElement !== inp) { inp.value = v; document.getElementById('lv-' + k).textContent = Number(v).toFixed(1); } }
  const notable = s.bergs.filter(b => b.notable).sort((a, b) => b.elgarz - a.elgarz);
  document.getElementById('roster').innerHTML = '<tr><th>#</th><th>Name</th><th>Hol</th><th>Met</th><th>Radio</th><th>Tag</th></tr>' +
    notable.map(b => `<tr class="${b.elgarz ? 'el' : ''}"><td>${b.num}</td><td>${b.name}</td><td>${b.hollow ? 'yes' : '-'}</td><td>${b.metal ? 'yes' : '-'}</td><td>${b.radio ? b.radio.freq + ' ' + b.radio.carrier[0] + ' ' + b.radio.shown + (b.radio.decoded === 'BRW' && b.radio.band === 'MID' ? ' ★TRIAD' : '') : '-'}${b.tombDrawn ? ' (drawn to Tomb)' : ''}</td><td>${b.tag || ''}</td></tr>`).join('') +
    (s.pending.length ? `<tr><td colspan="6" style="color:var(--dim)">Still to arrive: ${s.pending.map(b => b.name).join(', ')}</td></tr>` : '');
};
</script>
</body>
</html>
